name: Android

# Builds the Android viewer (apps/mobile) into a debug APK and keeps it as
# a workflow artifact, so every change can be installed on a phone without
# an Android toolchain on anyone's PC. GitHub's Ubuntu runners already
# ship the Android SDK; only the JDK needs setting up.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync it into the Android project
        run: npm run sync --workspace @relay/mobile

      - name: Build the debug APK
        working-directory: apps/mobile/android
        env:
          RELAY_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Proves the release key in the repository secrets still signs a
      # valid APK, so a broken key shows up here instead of on release day.
      # Nothing from this step is published.
      - name: Verify release signing
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: apps/mobile/android
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: 653ccce1a10159263ac6106317e6c1a317b01e7f2d5dfebdf232cb3a8968dbf3
        run: |
          # Runs GitHub gives no repository secrets (Dependabot PRs, forks)
          # can't sign; the debug APK above already proves the build.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets in this run; skipping the release signing check."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/relay-release.p12"
          export RELAY_KEYSTORE_FILE="$RUNNER_TEMP/relay-release.p12"
          ./gradlew assembleRelease --no-daemon -PrelayVersion=0.0.1
          rm -f "$RUNNER_TEMP/relay-release.p12"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          ls -l app/build/outputs/apk/release/
          # Print apksigner's whole answer (certificate DN and digests are
          # public), then require a signer.
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk 2>&1 | tee "$RUNNER_TEMP/apksigner.txt"
          # Must verify, and with the release certificate (its public
          # SHA-256 fingerprint), not some other key.
          grep -qx "Verifies" "$RUNNER_TEMP/apksigner.txt"
          grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" "$RUNNER_TEMP/apksigner.txt"
