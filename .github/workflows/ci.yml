name: CI

on:
  push:
    branches: [main]
    # README.md files are the only .md tracked in git (see .gitignore's
    # "*.md" + "!README.md" rule); a push touching only those has nothing
    # for this job to verify.
    paths-ignore:
      - "**/README.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Electron downloads its binary lazily on first launch, so this
      # doesn't pull a Chromium build onto the CI runner.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
