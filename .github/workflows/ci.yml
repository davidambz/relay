name: CI

on:
  push:
    branches: [main]
    # README.md files are the only .md tracked in git (see .gitignore's
    # "*.md" + "!README.md" rule); a push touching only those has nothing
    # for this job to verify.
    paths-ignore:
      - "**/README.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron downloads its binary lazily on first launch, so this
      # doesn't pull a Chromium build onto the CI runner.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
