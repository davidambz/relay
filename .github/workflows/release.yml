name: Release

# Pushing an annotated vX.Y.Z tag is the only way to cut a release (same
# as Umbra): `git tag -a v0.2.0 -m "plain-language notes" && git push
# origin v0.2.0`. There's no version file to bump; the tag is the version
# and is injected into the app and the installer here. The tag message
# becomes the release notes, written for the people downloading it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive the version from the pushed tag
        id: version
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test (gate)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build native helpers (audiocap, winlist)
        run: |
          foreach ($tool in "audiocap", "winlist") {
            cmake -S "native/$tool" -B "native/$tool/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build "native/$tool/build"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Stamp the version into the app
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --workspace @relay/desktop

      - name: Package the app (electron-builder --dir)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package --workspace @relay/desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps\desktop\installer\relay.iss /DMyAppVersion="${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Read release notes from the tag
        run: |
          # actions/checkout replaces the pushed annotated tag with a
          # lightweight one pointing at the commit, so %(contents) would
          # read the commit message instead (what v0.0.1 got, and the
          # unexplained wrong body on Umbra's v0.1.1). Re-fetch the real
          # tag object first.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          if ((git cat-file -t "${{ github.ref_name }}") -ne "tag") {
            Write-Host "::warning::${{ github.ref_name }} is not an annotated tag; release notes fall back to a default."
          }
          $message = (git tag -l --format="%(contents)" "${{ github.ref_name }}") -join "`n"
          if ([string]::IsNullOrWhiteSpace($message) -or (git cat-file -t "${{ github.ref_name }}") -ne "tag") {
            # A lightweight tag has no message; re-tag with `git tag -a`.
            $message = "Relay ${{ steps.version.outputs.version }}."
          }
          Write-Host "Release notes read from tag ${{ github.ref_name }}:"
          Write-Host $message
          $message | Out-File -FilePath release-notes.md -Encoding utf8NoBOM

      - name: Publish the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "apps/desktop/installer/output/RelaySetup-${{ steps.version.outputs.version }}.exe" `
            --title "Relay ${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md

  # The Android viewer, signed with the release key from repository
  # secrets, attached to the release the Windows job just published. A
  # failure here never blocks the desktop release.
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the version from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync it into the Android project
        run: npm run sync --workspace @relay/mobile

      - name: Build the signed release APK
        working-directory: apps/mobile/android
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_CERT_SHA256: 653ccce1a10159263ac6106317e6c1a317b01e7f2d5dfebdf232cb3a8968dbf3
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/relay-release.p12"
          export RELAY_KEYSTORE_FILE="$RUNNER_TEMP/relay-release.p12"
          ./gradlew assembleRelease --no-daemon -PrelayVersion=${{ steps.version.outputs.version }}
          # Never publish an APK that isn't signed with the release key
          # (checked by its certificate's public SHA-256 fingerprint).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" "$RUNNER_TEMP/apksigner.txt"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Relay-${{ steps.version.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/relay-release.p12"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Relay-${{ steps.version.outputs.version }}.apk"
