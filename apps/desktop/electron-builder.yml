# Only used to produce the unpacked app folder (release/win-unpacked).
# The installer itself is Inno Setup (installer/relay.iss), same as
# Umbra, so there's deliberately no nsis target here.
appId: com.davidambz.relay
productName: Relay
copyright: Copyright (C) 2026 David Ambrozio
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
asar: true
# Electron fuses, flipped in the packaged Relay.exe. Relay never needs
# Node-mode or debugger switches, and only ever loads its own app.asar,
# checked against the hash baked into the exe at build time.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  target: dir
  icon: build/icon.ico
  signAndEditExecutable: true
# Native helpers ship next to the app and are found through
# process.resourcesPath/bin (src/main/nativeTools.ts). Build them first
# with CMake (native/*/build).
extraResources:
  - from: ../../native/audiocap/build/audiocap.exe
    to: bin/audiocap.exe
  - from: ../../native/winlist/build/winlist.exe
    to: bin/winlist.exe
